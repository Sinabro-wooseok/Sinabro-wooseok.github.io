<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wooseok Stay · 이우석 이력서</title>
<meta name="description" content="A resume you can walk through: a pixel villa tour of full-stack engineer Wooseok Lee. 걸어서 둘러보는 이우석의 이력서.">
<meta property="og:title" content="Wooseok Stay · 걸어서 둘러보는 이력서">
<meta property="og:description" content="Walk the rooms, chat with the host, book at the front desk. Full-stack engineer, AI-agent workflows, Seoul area (GMT+9).">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sinabro-wooseok.github.io/">
<meta property="og:image" content="https://sinabro-wooseok.github.io/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wooseok Stay pixel villa map">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="mark" href="#top"><i>WL</i><span>WOOSEOK STAY</span></a>
    <div class="nav-r">
      <a class="btn-px small" href="#quick" data-i="quick"></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko">한</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <div class="press" data-i="press"></div>
    <h1 data-i="brand"></h1>
    <p class="role" data-i="name"></p>
    <p class="sub" data-i="tagline"></p>
    <ul class="kpi" id="kpi"></ul>
    <div class="meta">
      <span data-i="where"></span>
      <a href="mailto:woosuk547@naver.com">woosuk547@naver.com</a>
      <a href="https://github.com/Sinabro-wooseok" target="_blank" rel="noopener">github.com/Sinabro-wooseok</a>
      <a href="https://www.linkedin.com/in/%EC%9A%B0%EC%84%9D-%EC%9D%B4-77a868433" target="_blank" rel="noopener">LinkedIn</a>
      <a href="assets/Wooseok_Lee_Resume_EN.pdf" target="_blank" rel="noopener" data-i="pdf"></a>
    </div>
  </div>

  <div class="wrap">
    <div class="game" id="game">
      <div class="hud">
        <span><b data-i="visited"></b> <span id="pips" class="pips"></span> <span id="vcount"></span></span>
        <button type="button" class="hud-btn" id="reset" data-i="reset"></button>
      </div>
      <div class="map-wrap">
        <div class="map" id="map" tabindex="0" aria-label="villa map"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="stamp" id="stamp" hidden>
          <div class="stamp-in"><b data-i="stamp"></b><p data-i="stamp_sub"></p>
            <button type="button" class="btn-px" id="toFront" data-i="to_front"></button></div>
        </div>
      </div>
      <div class="ctrl">
        <p class="hint" id="hint"></p>
        <div class="dpad" aria-label="move">
          <button type="button" data-d="up" aria-label="up">&#9650;</button>
          <button type="button" data-d="left" aria-label="left">&#9664;</button>
          <button type="button" data-d="down" aria-label="down">&#9660;</button>
          <button type="button" data-d="right" aria-label="right">&#9654;</button>
        </div>
      </div>
      <div class="jump"><span data-i="jump"></span><div id="jump"></div></div>
    </div>
  </div>

  <div class="wrap quick" id="quick">
    <h2 class="qh"><span data-i="quick_title"></span><small data-i="quick_note"></small></h2>
    <div class="qgrid">
      <div>
        <section><h3 data-i="h_about"></h3><p data-i="about"></p><div class="feat" id="feat"></div></section>
        <section id="reviews-sec"><h3><span data-i="h_reviews"></span><small data-i="reviews_note"></small></h3><div data-slot="reviews"></div></section>
        <section><h3 data-i="h_amen"></h3><div data-slot="skills"></div></section>
        <section><h3 data-i="h_stays"></h3><div data-slot="career"></div></section>
        <section><h3><span data-i="h_gallery"></span><small data-i="gallery_note"></small></h3><div data-slot="garden"></div></section>
        <section><h3 data-i="h_rules"></h3><div data-slot="ai"></div></section>
        <section><h3 data-i="h_where"></h3><div class="tz" id="tz"></div></section>
      </div>
      <aside class="side">
        <div class="card-px">
          <div class="price"><b data-i="rate"></b> <span data-i="rate_unit"></span></div>
          <button type="button" class="btn-px wide" data-open="book" data-i="cta"></button>
          <button type="button" class="btn-px wide ghost" data-open="chat" data-i="chat_title"></button>
          <p class="note" data-i="no_charge"></p>
        </div>
      </aside>
    </div>
  </div>
</main>

<footer><div class="wrap" data-i="footer"></div></footer>

<!-- 방 내용 -->
<dialog id="room" class="px-dlg">
  <div class="dlg-head"><b id="roomTitle"></b><button type="button" class="x" data-close aria-label="close">X</button></div>
  <div class="dlg-body" id="roomBody"></div>
</dialog>

<!-- 호스트 채팅 -->
<dialog id="chat" class="px-dlg">
  <div class="dlg-head"><b data-i="chat_title"></b><button type="button" class="x" data-close aria-label="close">X</button></div>
  <div class="chat-log" id="chatLog" aria-live="polite"></div>
  <div class="chat-q" id="chatQ"></div>
</dialog>

<!-- 예약 -->
<dialog id="book" class="px-dlg">
  <div class="dlg-head"><b data-i="front"></b><button type="button" class="x" data-close aria-label="close">X</button></div>
  <div class="dlg-body">
    <div class="price"><b data-i="rate"></b> <span data-i="rate_unit"></span></div>
    <form id="form" novalidate>
      <label class="field"><span data-i="f_checkin"></span><input type="date" id="checkin" required></label>
      <div class="err" id="err"></div>
      <label class="field"><span data-i="f_type"></span><select id="type"></select></label>
      <div class="field"><span data-i="f_mode"></span><div class="seg" id="mode" role="group"></div></div>
      <label class="field"><span data-i="f_team"></span><input type="text" id="team" maxlength="60" autocomplete="organization"></label>
      <button class="btn-px wide" type="submit" data-i="cta"></button>
      <p class="note" data-i="no_charge"></p>
    </form>
    <div class="sum" id="sum"></div>
  </div>
</dialog>

<!-- 예약 확정 -->
<dialog id="dlg" class="px-dlg">
  <div class="dlg-head"><b data-i="conf_title"></b><code id="cno"></code></div>
  <div class="dlg-body">
    <p data-i="conf_body"></p>
    <dl id="cdl" class="cdl"></dl>
    <div class="act"><a id="mail" class="btn-px" href="#" data-i="send"></a><button type="button" class="btn-px ghost" data-close data-i="close"></button></div>
  </div>
</dialog>

<script src="data.js"></script>
<script src="game-data.js"></script>
<script src="app.js"></script>
<script src="game.js"></script>
</body>
</html>
